[package]
name = "license"
version.workspace = true
edition.workspace = true

# Offline device-bound license tokens: a signed {name, device hashes, features, expiry} the app checks with a public key
# built into it. The private key stays with the owner (the license server) and `licensegen` is a dev/pilot tool.
[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

[[bin]]
name = "licensegen"
path = "src/bin/licensegen.rs"
